# 24 - vigil-demo-shop (DEV ONLY): a tiny fake shop so demos and tests never
# scrape real websites. Price, stock, page layout and notices are changed from
# http://demo.localhost:8081/admin. Its state is in memory - keep ONE replica so
# every request sees the same state.
---
apiVersion: v1
kind: Service
metadata:
  name: vigil-demo-shop                         # watches use http://vigil-demo-shop:8000/...
  namespace: vigil
  labels: {app.kubernetes.io/name: vigil, app.kubernetes.io/component: demo-shop, app.kubernetes.io/part-of: vigil}
spec:
  selector: {app.kubernetes.io/name: vigil, app.kubernetes.io/component: demo-shop}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-demo-shop
  namespace: vigil
  labels: {app.kubernetes.io/name: vigil, app.kubernetes.io/component: demo-shop, app.kubernetes.io/part-of: vigil}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: vigil, app.kubernetes.io/component: demo-shop}
  template:
    metadata:
      labels: {app.kubernetes.io/name: vigil, app.kubernetes.io/component: demo-shop, app.kubernetes.io/part-of: vigil}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: demo-shop
          image: vigil-core:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "vigil.demo_shop:app", "--host", "0.0.0.0", "--port", "8000", "--no-server-header"]
          ports:
            - {name: http, containerPort: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {cpu: 200m, memory: 128Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
