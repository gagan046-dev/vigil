# 02 - Secret (EXAMPLE ONLY - do not apply this file with real values, never commit real values)
#
# The real Secret is created by scripts/create-dev-secret.ps1, which generates
# random values and sends them straight to the cluster:
#   powershell -File scripts/create-dev-secret.ps1
#
# A Secret holds sensitive values. Pods read single keys with "secretKeyRef".
# Note: "stringData" is plain text here; Kubernetes stores it base64-encoded,
# which is encoding, NOT encryption - so this file must never hold real values.
apiVersion: v1
kind: Secret
metadata:
  name: vigil-secrets
  namespace: vigil
  labels:
    app.kubernetes.io/part-of: vigil
type: Opaque
stringData:
  postgres-password: "CHANGE-ME-placeholder"   # password of the "vigil" database user
  internal-token: "CHANGE-ME-placeholder"      # bearer token CronJob triggers send to /internal/trigger
  # Optional, only for the LLM gateway in production:
  # openrouter-api-key: "<your key>"
