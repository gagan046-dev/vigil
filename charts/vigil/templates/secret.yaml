{{- /*
Secret (ONLY when secrets.create: true - meant for local development).
In production secrets.create is false and the Secret is provided separately
(a SealedSecret in Phase 3), so no real password ever sits in values files or git.
"required" stops the install with a clear message if a value is missing.
*/ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.labels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "secrets.postgresPassword is required when secrets.create=true" .Values.secrets.postgresPassword | quote }}
  internal-token: {{ required "secrets.internalToken is required when secrets.create=true" .Values.secrets.internalToken | quote }}
{{- end }}
