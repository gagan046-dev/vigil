{{- /*
vigil-worker: takes check jobs from the Redis list "vigil:checks", fetches the page
(plain HTTP, or headless Chromium for JavaScript pages), extracts the value, evaluates
the condition and queues notifications. With autoscaling.enabled, KEDA owns the
replica count (0 or 1 .. 5 pods depending on the queue length).
*/ -}}
{{- $sel := include "vigil.selectorLabels" (dict "root" . "component" "worker") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.labels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  {{- /* No replicas when KEDA scales it, otherwise every helm upgrade would fight KEDA. */}}
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vigil.labels" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        {{- include "vigil.configChecksums" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false       # the worker never calls the Kubernetes API
      # On scale-down Kubernetes sends SIGTERM; the worker finishes the current check.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- include "vigil.imagePullSecrets" . | nindent 6 }}
      securityContext:                          # uid 1001 = "pwuser" of the Playwright image
        {{- include "vigil.podSecurity" (dict "uid" 1001 "fsGroup" 1001) | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "vigil.image" (dict "root" . "image" .Values.worker.image) }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          ports:
            - {name: metrics, containerPort: 9100}   # Prometheus metrics
          envFrom:
            - configMapRef: {name: vigil-config}
          env:
            {{- include "vigil.envPostgresPassword" . | nindent 12 }}
            {{- include "vigil.envLlmKey" . | nindent 12 }}
            - {name: HOME, value: /tmp}         # Chromium writes its profile under $HOME
          securityContext:
            {{- include "vigil.containerSecurity" dict | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:                        # the metrics server runs in its own thread
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: dshm, mountPath: /dev/shm}  # shared memory for Chromium
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: {{ .Values.worker.shmSize }}}
{{- with .Values.worker.autoscaling }}
{{- if .enabled }}
---
# KEDA ScaledObject: scale vigil-worker on the length of the Redis list "vigil:checks".
# KEDA creates an HPA (keda-hpa-vigil-worker) and handles the 0 <-> 1 step itself.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vigil-worker
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vigil.labels" (dict "root" $ "component" "worker") | nindent 4 }}
spec:
  scaleTargetRef:
    name: vigil-worker
  minReplicaCount: {{ .minReplicas }}
  maxReplicaCount: {{ .maxReplicas }}
  {{- if eq (int .minReplicas) 0 }}
  # Only used for the 0 <-> 1 step (KEDA warns if they are set with minReplicas > 0).
  pollingInterval: {{ .pollingInterval }}       # look at the queue every N seconds
  cooldownPeriod: {{ .cooldownPeriod }}         # empty queue this long -> back to 0 pods
  {{- end }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .scaleDownStabilizationSeconds }}
          policies:
            - {type: Percent, value: 100, periodSeconds: 15}
  triggers:
    - type: redis
      metadata:
        address: vigil-redis.{{ $.Release.Namespace }}.svc.cluster.local:6379
        listName: "vigil:checks"
        listLength: {{ .listLength | quote }}   # target queued jobs per worker pod
        activationListLength: "0"               # any queued job wakes the first worker
{{- end }}
{{- end }}
