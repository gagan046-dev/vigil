{{- /*
Redis: the job queues (vigil:checks, vigil:notify), the de-duplication set, the LLM
budget counter and per-host politeness keys. "appendonly yes" writes every change to
disk, so queued jobs survive a restart.
*/ -}}
{{- $sel := include "vigil.selectorLabels" (dict "root" . "component" "redis") }}
apiVersion: v1
kind: Service
metadata:
  name: vigil-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.labels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  selector:
    {{- $sel | nindent 4 }}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vigil-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.labels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  serviceName: vigil-redis
  replicas: 1
  selector:
    matchLabels:
      {{- $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vigil.labels" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "vigil.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "vigil.podSecurity" (dict "uid" 999 "gid" 1000 "fsGroup" 1000) | nindent 8 }}
      containers:
        - name: redis
          image: {{ include "vigil.image" (dict "root" . "image" .Values.redis.image) }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          # --appendonly yes: durable queue; --save "": no extra snapshots; --maxmemory: bounded
          args: ["redis-server", "--appendonly", "yes", "--dir", "/data", "--save", "", "--maxmemory", {{ .Values.redis.maxMemory | quote }}]
          ports:
            - {name: redis, containerPort: 6379}
          securityContext:
            {{- include "vigil.containerSecurity" dict | nindent 12 }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- $sel | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.redis.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.storage.size }}
