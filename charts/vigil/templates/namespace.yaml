{{- /*
Optional Namespace (namespace.create: true). Usually the namespace is created by
"helm install --create-namespace" or by Argo CD instead. The Pod Security labels make
Kubernetes REJECT any pod that breaks the "restricted" profile.
*/ -}}
{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: vigil
    pod-security.kubernetes.io/enforce: {{ .Values.namespace.podSecurity }}
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: {{ .Values.namespace.podSecurity }}
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: {{ .Values.namespace.podSecurity }}
    pod-security.kubernetes.io/audit-version: latest
{{- end }}
