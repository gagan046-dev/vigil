# values-prod.yaml - the "production" environment.
# Only the settings that differ from values.yaml are listed here.

environment: prod

config:
  llmMode: gateway                    # use the LiteLLM gateway below
  minIntervalMinutes: 5               # be polite to websites: at most every 5 minutes
  allowedInternalHosts: ""            # no internal hosts may be watched
  searchProvider: searxng             # Compare searches the real web through vigil-searxng

# The Secret "vigil-secrets" must ALREADY exist in the namespace (in Phase 3 it comes
# from a SealedSecret). Required keys: postgres-password, internal-token.
# Required with searxng.enabled: searxng-secret.
# Optional keys: openrouter-api-key, llm-master-key, telegram-bot-token, telegram-chat-id.
secrets:
  create: false
  name: vigil-secrets

worker:
  autoscaling:
    minReplicas: 1                    # always one warm worker (no cold start)

demoShop:
  enabled: false

llmGateway:
  enabled: true                       # starts even without an OpenRouter key (optional secretKeyRef)

searxng:
  enabled: true                       # web search for Compare (secret key from the SealedSecret)

ingress:
  hosts:
    app: vigil-prod.localhost
