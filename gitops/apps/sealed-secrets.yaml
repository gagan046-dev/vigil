# sealed-secrets.yaml - the Sealed Secrets controller (chart 2.20.0, controller v0.40.0).
#
# Why: the prod Secret (database password, internal token) must live in git like
# everything else, but the repo is PUBLIC. "kubeseal" encrypts a Secret with this
# controller's public key; only the controller (private key, inside the cluster) can
# decrypt it. So the encrypted SealedSecret is safe to commit.
#
# Chart source: the chart's Helm repo page (bitnami-labs.github.io/sealed-secrets)
# returned 404 when this was set up, so the chart is taken straight from the project's
# git repository at the release tag helm-v2.20.0 (same chart, same version).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/bitnami-labs/sealed-secrets.git
    targetRevision: helm-v2.20.0
    path: helm/sealed-secrets
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # kubeseal looks for a controller called "sealed-secrets-controller" in
        # kube-system by default, so no extra kubeseal flags are needed.
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
