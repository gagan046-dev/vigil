# vigil-secrets.sealed.yaml - the prod Secret "vigil-secrets", ENCRYPTED with kubeseal.
# Safe to commit to a public repo: only the sealed-secrets controller in THIS cluster
# (its private key never leaves kube-system) can decrypt it. It is bound to the name
# vigil-secrets in namespace vigil-prod ("strict" scope) and cannot be reused elsewhere.
# Keys: postgres-password, internal-token, llm-master-key (all random). The optional
# openrouter-api-key is NOT here - see docs/notes/gitops-verification.md for how to add it.
# A new cluster has a new key pair, so this file must then be re-sealed (same doc).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: vigil-secrets
  namespace: vigil-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"   # the Secret exists before any pod needs it
spec:
  encryptedData:
    internal-token: 
    llm-master-key: 
    postgres-password: 
  template:
    metadata:
      name: vigil-secrets
      namespace: vigil-prod
