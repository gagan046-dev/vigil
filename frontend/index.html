<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Vigil watches web pages and prices for you and tells you only when something you care about changes.">
  <title>Vigil</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <!-- Applies the saved theme / sidebar state before first paint (CSP forbids inline scripts). -->
  <script src="js/boot.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-watches" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.75"/></symbol>
      <symbol id="i-compare" viewBox="0 0 24 24"><path d="M3.5 12.6V4.5a1 1 0 0 1 1-1h8.1a1 1 0 0 1 .7.3l7.2 7.2a1 1 0 0 1 0 1.4l-8.1 8.1a1 1 0 0 1-1.4 0l-7.2-7.2a1 1 0 0 1-.3-.7z"/><circle cx="8.5" cy="8.5" r="1.5"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
      <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></symbol>
      <symbol id="i-system" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
      <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
      <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
      <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.1" fill="currentColor"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/><circle cx="18.5" cy="12" r="1.1" fill="currentColor"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-check-all" viewBox="0 0 24 24"><path d="m2.5 12.5 4.5 4.5 9-9.5M11.5 16.5l.5.5 9.5-9.5"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4.5h5.5V10M19.5 4.5 11 13M18 14v4.5a1 1 0 0 1-1 1H5.5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1H10"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l.8 12a1 1 0 0 0 1 .9h7.4a1 1 0 0 0 1-.9l.8-12"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.75"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M9 4.5v15"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5 3.2 19.5h17.6z"/><path d="M12 10v4M12 16.8v.2"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 7.8v.2"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6.5 13.5 12 19l5.5-5.5"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></symbol>
      <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9.5 3.5h5M10 3.5v6L4.8 18.3a1.5 1.5 0 0 0 1.3 2.2h11.8a1.5 1.5 0 0 0 1.3-2.2L14 9.5v-6M7.5 14.5h9"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></symbol>
    </defs>
  </svg>

  <a class="skip-link" href="#main">Skip to content</a>

  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <div class="sidebar__inner">
      <div class="sidebar__brand">
        <a href="#/watches" class="brand" aria-label="Vigil home">
          <img src="favicon.svg" alt="" width="22" height="22">
          <span class="brand__name">Vigil</span>
        </a>
        <button type="button" class="icon-btn sidebar__collapse" id="sidebar-toggle" aria-label="Collapse sidebar" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="#i-panel"/></svg>
        </button>
      </div>
      <ul class="nav" role="list">
        <li><a class="nav__item" href="#/watches" data-nav="watches"><svg class="icon" aria-hidden="true"><use href="#i-watches"/></svg><span class="nav__label">Watches</span></a></li>
        <li><a class="nav__item" href="#/compare" data-nav="compare"><svg class="icon" aria-hidden="true"><use href="#i-compare"/></svg><span class="nav__label">Compare</span></a></li>
        <li><a class="nav__item" href="#/inbox" data-nav="inbox"><span class="nav__icon-wrap"><svg class="icon" aria-hidden="true"><use href="#i-inbox"/></svg><span class="badge" id="unread-badge" hidden></span></span><span class="nav__label">Inbox</span></a></li>
        <li><a class="nav__item" href="#/activity" data-nav="activity"><svg class="icon" aria-hidden="true"><use href="#i-activity"/></svg><span class="nav__label">Activity</span></a></li>
        <li><a class="nav__item" href="#/system" data-nav="system"><svg class="icon" aria-hidden="true"><use href="#i-system"/></svg><span class="nav__label">System</span></a></li>
      </ul>
      <div class="sidebar__foot">
        <div class="conn" id="conn" title="API connection"><span class="conn__dot"></span><span class="nav__label conn__label">Connecting</span></div>
        <button type="button" class="nav__item theme-toggle" id="theme-toggle" aria-label="Switch to dark theme">
          <svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg><span class="nav__label">Dark theme</span>
        </button>
      </div>
      </div>
    </nav>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar__titles">
          <nav class="crumbs" id="crumbs" aria-label="Breadcrumb" hidden></nav>
          <h1 class="topbar__title" id="page-title" tabindex="-1">Watches</h1>
        </div>
        <div class="topbar__actions">
          <button type="button" class="btn btn--primary" id="btn-new-watch">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span class="btn__label">New watch</span>
          </button>
        </div>
      </header>
      <main id="main" class="page" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
