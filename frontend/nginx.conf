# Vigil frontend — served by nginx-unprivileged (runs as uid 101, listens on 8080).
# Installed as /etc/nginx/conf.d/default.conf; the image's main nginx.conf provides the
# http{} context, writes its pid and temp files under /tmp (mount an emptyDir there when the
# root filesystem is read-only).

upstream vigil_api {
    server vigil-api:8000;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 64k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers, repeated in each location because add_header does not inherit
    # once a location declares its own.
    include /etc/nginx/snippets/security-headers.conf;

    # Liveness/readiness for Kubernetes — no upstream dependency.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # API proxy. Dry runs wait up to 60 s for a worker, so the read timeout is 75 s.
    location /api/ {
        proxy_pass http://vigil_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 75s;
        proxy_buffering on;
        proxy_hide_header X-Powered-By;
        # When nginx itself cannot reach the API, answer in the API's JSON error shape.
        # (Errors returned BY the API, e.g. a dry-run 504, pass through untouched.)
        error_page 502 503 504 = @api_unreachable;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location @api_unreachable {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 502 '{"detail":"The Vigil API is not reachable right now."}';
    }

    # /internal/* is only for in-cluster CronJob triggers, never via the public frontend.
    location /internal/ {
        return 404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:js|css|svg)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;   # no content hashes: revalidate via ETag
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
